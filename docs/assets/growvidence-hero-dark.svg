<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Growvidence — make progress you can prove</title>
  <desc id="desc">A clear text panel on the left and a separate animated progress path with milestones and a growing sprout on the right. The path never crosses the text.</desc>
  <style>
    .bg{fill:#171715}.ink{fill:#f2eee3}.muted{fill:#c5bfb3}.accent{fill:#ff805f}.green{fill:#70c58a}
    .path{fill:none;stroke:#ff805f;stroke-width:7;stroke-linecap:round;stroke-dasharray:12 13}
    .motion{opacity:1}
    .leaf{fill:#70c58a}
    @media(prefers-reduced-motion:reduce){.motion{display:none}}
  .leaf.secondary{fill:#a0dda9}
  </style>
  <rect class="bg" width="1200" height="420" rx="28"/>
  <circle cx="1000" cy="96" r="132" fill="#292821"/>
  <g class="ink" font-family="system-ui,sans-serif">
    <text x="72" y="100" font-size="18" font-weight="700" letter-spacing="4" fill="#ff805f">LEARN WITH INTENT</text>
    <text x="72" y="184" font-size="60" font-weight="800">Make progress</text>
    <text x="72" y="254" font-size="60" font-weight="800">you can prove.</text>
    <text x="74" y="322" font-size="20" class="muted">Practice → artifacts → independent demonstration</text>
  </g>
  <!-- Illustration has its own reserved right-side region (x=650..1150). -->
  <path class="path" d="M675 355 C740 350 790 315 830 278 S920 210 975 180 S1080 115 1132 70"/>
  <path class="path motion" d="M675 355 C740 350 790 315 830 278 S920 210 975 180 S1080 115 1132 70">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="7s" repeatCount="indefinite"/>
  </path>
  <g fill="#292821" stroke="#ff805f" stroke-width="6">
    <circle cx="720" cy="338" r="15"/><circle cx="830" cy="278" r="15"/><circle cx="975" cy="180" r="15"/><circle cx="1090" cy="110" r="15"/>
  </g>
  <g class="motion" fill="#ff805f" fill-opacity="0.12" stroke="#ff805f" stroke-width="3">
    <circle cx="720" cy="338" r="15"><animate attributeName="r" values="15;22;15" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.12;0.38;0.12" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="278" r="15"><animate attributeName="r" values="15;22;15" dur="2.2s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.12;0.38;0.12" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="975" cy="180" r="15"><animate attributeName="r" values="15;22;15" dur="2.2s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.12;0.38;0.12" dur="2.2s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="110" r="15"><animate attributeName="r" values="15;22;15" dur="2.2s" begin="3.3s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.12;0.38;0.12" dur="2.2s" begin="3.3s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Static plant is complete; moving leaves are a decorative overlay. -->
  <g transform="translate(1048 300)">
    <path d="M0 92V12" stroke="#70c58a" stroke-width="8" stroke-linecap="round"/>
    <path class="leaf" d="M0 48C-42 47-55 12-25 5C-6 5 1 25 0 48Z"/>
    <path class="leaf secondary" d="M0 74C42 71 54 36 28 28C8 25-1 48 0 74Z" fill="#a0dda9"/>
  </g>
  <g class="motion" transform="translate(1048 300)">
    <path d="M0 92V12" stroke="#70c58a" stroke-width="8" stroke-linecap="round"/>
    <path class="leaf" d="M0 48C-42 47-55 12-25 5C-6 5 1 25 0 48Z">
      <animateTransform attributeName="transform" type="rotate" values="0 0 48;5 0 48;0 0 48;-3 0 48;0 0 48" dur="5s" repeatCount="indefinite"/>
    </path>
    <path class="leaf" d="M0 74C42 71 54 36 28 28C8 25-1 48 0 74Z" fill="#a0dda9">
      <animateTransform attributeName="transform" type="rotate" values="0 0 74;-4 0 74;0 0 74;3 0 74;0 0 74" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>