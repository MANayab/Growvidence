<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="t d"><title id="t">The Growvidence evidence trail</title><desc id="d">Five connected stages: Learn, Practice, Create, Demonstrate and Review.</desc><style>.track{stroke:#c8431f;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 11;animation:dash 7s linear infinite}.node{fill:#f2eee3;stroke:#c8431f;stroke-width:5}.label{font:700 20px system-ui,sans-serif;fill:#1c1b19}.sub{font:14px system-ui,sans-serif;fill:#686157}@keyframes dash{to{stroke-dashoffset:-200}}@media(prefers-reduced-motion:reduce){.track{animation:none}}</style><path class="track" d="M95 72H905"/><g><circle class="node" cx="95" cy="72" r="20"/><circle class="node" cx="297" cy="72" r="20"/><circle class="node" cx="500" cy="72" r="20"/><circle class="node" cx="703" cy="72" r="20"/><circle class="node" cx="905" cy="72" r="20"/></g><g text-anchor="middle"><text class="label" x="95" y="125">Learn</text><text class="sub" x="95" y="148">Understand</text><text class="label" x="297" y="125">Practice</text><text class="sub" x="297" y="148">Try deliberately</text><text class="label" x="500" y="125">Create</text><text class="sub" x="500" y="148">Make an artifact</text><text class="label" x="703" y="125">Demonstrate</text><text class="sub" x="703" y="148">Work independently</text><text class="label" x="905" y="125">Review</text><text class="sub" x="905" y="148">Assess evidence</text></g></svg>