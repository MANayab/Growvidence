<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Growvidence learning into evidence</title><desc id="desc">Warm paper background, a rising path through milestones, and a growing plant motif.</desc><style>.bg{fill:#f2eee3}.ink{fill:#1c1b19}.muted{fill:#686157}.accent{fill:#c8431f}.line{fill:none;stroke:#c8431f;stroke-width:7;stroke-linecap:round;stroke-dasharray:14 13;animation:travel 8s linear infinite}.leaf{transform-box:fill-box;transform-origin:center;animation:sway 4s ease-in-out infinite alternate}@keyframes travel{to{stroke-dashoffset:-216}}@keyframes sway{to{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){.line,.leaf{animation:none}}</style><rect class="bg" width="1200" height="420" rx="28"/><circle cx="1030" cy="90" r="125" fill="#e9ddc9"/><path d="M55 335 C220 335 250 260 400 275 S610 335 735 225 S940 185 1110 70" class="line"/><g class="ink" font-family="system-ui,sans-serif"><text x="78" y="105" font-size="20" font-weight="700" letter-spacing="5" fill="#c8431f">LEARN WITH INTENT</text><text x="78" y="178" font-size="58" font-weight="800">Make progress</text><text x="78" y="244" font-size="58" font-weight="800">you can prove.</text><text x="82" y="292" font-size="21" class="muted">Practice → artifacts → independent demonstration</text></g><g fill="#fff" stroke="#c8431f" stroke-width="6"><circle cx="190" cy="326" r="16"/><circle cx="400" cy="275" r="16"/><circle cx="735" cy="225" r="16"/><circle cx="965" cy="170" r="16"/></g><g transform="translate(1015 104)"><path d="M0 120V20" stroke="#1f6b45" stroke-width="8" stroke-linecap="round"/><path class="leaf" d="M0 54C-58 52-66 7-26 4C-4 4 5 27 0 54Z" fill="#1f6b45"/><path class="leaf" d="M0 84C55 81 67 37 30 30C8 27-2 55 0 84Z" fill="#4b8b61"/></g></svg>